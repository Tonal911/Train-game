<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRAIN GAME!</title>
  <link rel="icon" href="/assets/loco.jpg">
  <link rel="stylesheet" href="/css/style.css">
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
</head>
<body>
  <canvas id="sky"></canvas>
  <div id="app">
    <div id="boot" class="screen center">
      <div class="title-blob"><h1 class="title">TRAIN GAME!</h1></div>
      <p class="outline big" id="bootmsg">Loading the choo-choos…</p>
    </div>
  </div>
  <!-- Intro: click to start (unlocks audio) -> unskippable 3 s fade from black + swell -> LET ME IN!! pops in 1 s after load. -->
  <div id="intro">
    <img id="intro-img" src="/assets/loco.jpg" alt="TRAIN GAME!">
    <button id="intro-start" type="button" disabled>
      <svg class="mini-loco" viewBox="0 0 240 140" aria-hidden="true">
        <g class="puffs"><circle cx="186" cy="18" r="11"/><circle cx="200" cy="10" r="8"/><circle cx="172" cy="12" r="7"/></g>
        <line x1="4" y1="130" x2="236" y2="130" class="rail"/>
        <path d="M222 116 L236 128 L190 128 L190 100 Z" class="red"/>
        <rect x="88" y="62" width="112" height="44" rx="20" class="black"/>
        <rect x="100" y="60" width="4" height="48" class="gold"/><rect x="140" y="60" width="4" height="48" class="gold"/><rect x="176" y="60" width="4" height="48" class="gold"/>
        <path d="M174 62 L170 30 L196 30 L192 62 Z" class="black"/><rect x="166" y="24" width="34" height="8" rx="3" class="black"/>
        <path d="M128 62 Q136 44 144 62 Z" class="gold"/>
        <circle cx="206" cy="74" r="9" class="gold"/><circle cx="206" cy="74" r="5" class="lamp"/>
        <rect x="30" y="40" width="62" height="70" rx="4" class="red"/><rect x="24" y="32" width="74" height="10" rx="4" class="black"/>
        <rect x="42" y="52" width="22" height="20" rx="3" class="win"/><rect x="70" y="52" width="14" height="20" rx="3" class="win"/>
        <rect x="26" y="104" width="190" height="10" rx="3" class="black"/>
        <g class="wheel" style="transform-origin:62px 112px"><circle cx="62" cy="112" r="17" class="red"/><path d="M62 95 V129 M45 112 H79 M50 100 L74 124 M74 100 L50 124" class="spoke"/></g>
        <g class="wheel" style="transform-origin:112px 112px"><circle cx="112" cy="112" r="17" class="red"/><path d="M112 95 V129 M95 112 H129 M100 100 L124 124 M124 100 L100 124" class="spoke"/></g>
        <g class="wheel" style="transform-origin:180px 120px"><circle cx="180" cy="120" r="10" class="red"/><path d="M180 110 V130 M170 120 H190" class="spoke"/></g>
        <line x1="62" y1="112" x2="112" y2="112" class="rod"/>
      </svg>
      <span class="label">CLICK TO START</span>
    </button>
    <button id="intro-btn" class="hidden" type="button">LET ME IN!!</button>
  </div>
  <script>
    (function () {
      var FADE_MS = 3000, AFTER_MS = 1000, GIVE_UP_MS = 20000;
      var img = document.getElementById('intro-img'), btn = document.getElementById('intro-btn'), intro = document.getElementById('intro');
      var startBtn = document.getElementById('intro-start');
      var appReady = new Promise(function (res) { window.__introAppReady = res; setTimeout(res, GIVE_UP_MS); });
      var imgReady = new Promise(function (res) { if (img.complete && img.naturalWidth) res(); else { img.onload = res; img.onerror = res; } });
      // main.js enables the start button once its audio hooks exist, so the click itself unlocks audio
      window.__introEnableStart = function () { startBtn.disabled = false; };
      var started = false;
      function start(e) {
        if (started || startBtn.disabled) return;
        started = true;
        if (e && e.preventDefault) e.preventDefault();
        if (window.__introHooks) window.__introHooks.start();
        startBtn.classList.add('gone');
        imgReady.then(function () {
          img.classList.add('fading');
          setTimeout(function () {
            appReady.then(function () { setTimeout(function () { btn.classList.remove('hidden'); btn.classList.add('pop'); btn.focus(); }, AFTER_MS); });
          }, FADE_MS);
        });
      }
      startBtn.addEventListener('pointerdown', start);
      startBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') start(e); });
      var left = false;
      function letMeIn(e) {
        if (left) return;
        left = true;
        if (e && e.preventDefault) e.preventDefault();
        if (window.__introHooks) window.__introHooks.letMeIn();
        intro.classList.add('leaving');
        setTimeout(function () { intro.remove(); }, 450);
      }
      btn.addEventListener('pointerdown', letMeIn); // fires on press, not release: zero-lag fart
      btn.addEventListener('click', letMeIn);
    })();
  </script>
  <div id="conn" class="hidden">Reconnecting…</div>
  <div id="toast"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
