  <script>
    (function () {
      var FADE_MS = 3000, AFTER_MS = 1000, GIVE_UP_MS = 20000;
      var img = document.getElementById('intro-img'), btn = document.getElementById('intro-btn'), intro = document.getElementById('intro');
      var startBtn = document.getElementById('intro-start');
      var appReady = new Promise(function (res) { window.__introAppReady = res; setTimeout(res, GIVE_UP_MS); });
      var imgReady = new Promise(function (res) { if (img.complete && img.naturalWidth) res(); else { img.onload = res; img.onerror = res; } });
      // main.js enables the start button once its audio hooks exist, so the click itself unlocks audio
      window.__introEnableStart = function () { startBtn.disabled = false; };
      var started = false;
      function start(e) {
        if (started || startBtn.disabled) return;
        started = true;
        if (e && e.preventDefault) e.preventDefault();
        if (window.__introHooks) window.__introHooks.start();
        document.getElementById('intro-start-row').classList.add('gone');
        imgReady.then(function () {
          img.classList.add('fading');
          setTimeout(function () {
            appReady.then(function () { setTimeout(function () { btn.classList.remove('hidden'); }, AFTER_MS); });
          }, FADE_MS);
        });
      }
      startBtn.addEventListener('pointerdown', start);
      startBtn.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') start(e); });
      var left = false;
      function letMeIn(e) {
        if (left) return;
        left = true;
        if (e && e.preventDefault) e.preventDefault();
        if (window.__introHooks) window.__introHooks.letMeIn();
        intro.classList.add('leaving');
        setTimeout(function () { intro.remove(); }, 450);
      }
      btn.addEventListener('pointerdown', letMeIn); // fires on press, not release: zero-lag fart
      btn.addEventListener('click', letMeIn);
    })();
  </script>
